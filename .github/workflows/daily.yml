name: daily

on:
  # GitHub opóźnia (a przy dużym obciążeniu pomija) zdarzenia `schedule`, najbardziej o pełnych godzinach:
  # 8.10.2026 przebieg z 05:00 UTC ruszył dopiero o 11:45. Dlatego start w „nieokrągłej” minucie i dwa
  # przebiegi zapasowe; job `gate` przepuszcza tylko pierwszy, który dziś wyśle digest (1 pobranie danych/dzień).
  schedule:
    - cron: "41 4 * * *"   # 04:41 UTC = 6:41 CEST / 5:41 CET
    - cron: "41 5 * * *"   # zapas
    - cron: "41 6 * * *"   # zapas
  workflow_dispatch:

# Domyślnie zero uprawnień; każdy job dostaje tylko to, czego potrzebuje.
permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # odczyt dzisiejszych przebiegów tego workflow
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: core/schedule_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: python3 core/schedule_gate.py

  build:
    needs: gate
    # Fail-open: także gdy sam job `gate` zawiedzie (np. awaria checkoutu), przebieg się wykonuje.
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit danych (jedyny job z prawem zapisu do repo)
      pages: read       # configure-pages odczytuje konfigurację Pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements.txt && python -m pip check
      - name: Zbuduj dane (adaptery, dedupe, ICS)
        run: python -m core.build
      - name: Commit danych, jeśli się zmieniły
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak zmian w danych, bez commita."
          else
            git commit -m "Dane: aktualizacja $(date -u +%F)"
            git pull --rebase -q
            git push
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements.txt && python -m pip check
      - name: Digest i alerty ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m core.digest
