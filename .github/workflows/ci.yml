name: ci

on:
  push:
    branches: [main]
    paths-ignore:   # dane generowane przez daily nie wymagają testów; ręczne pliki w data/ tak
      - data/events.json
      - data/status.json
      - data/seen_ids.json
      - data/ics_state.json
      - data/keepalive.txt
      - data/source_cache/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
