.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}

.d{aspect-ratio:1/1;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.d:disabled{visibility:hidden}
.d.t{outline:2px solid var(--acc)}.d.s{background:var(--ink);color:var(--bg)}
.d em{display:flex;gap:2px;height:6px}.d em u{width:6px;height:6px;border-radius:50%}
.d:focus-visible,.chip:focus-visible,.a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
.ev{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ev h3{margin:0;font-size:17px;line-height:1.25}.ev p{margin:3px 0 0;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.a{display:inline-block;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink)}
.a.p{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{color:var(--mut);padding:14px 0}
.src{margin-top:28px;font-size:13px;color:var(--mut)}.src a{color:var(--ink)}
.clr{font-size:14px;border:0;background:none;color:var(--acc);cursor:pointer;font-weight:600;padding:0}

var $=function(i){return document.getElementById(i)},now=new Date(),pad=function(n){return(n<10?"0":"")+n};
