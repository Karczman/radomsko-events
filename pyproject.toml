[project]
name = "radomsko-events"
version = "0.1.0"
description = "Kalendarz wydarzeń w Radomsku i okolicy (do 30 km)"
requires-python = ">=3.12"
dependencies = ["httpx", "selectolax", "pydantic>=2", "rapidfuzz", "icalendar", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]

[tool.setuptools]
packages = ["core", "sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
